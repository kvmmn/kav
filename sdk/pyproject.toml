[project]
name = "kav-sdk"
version = "0.1.0"
description = "KAV contracts as Python: Pydantic models, project memory, Host Adapter v0.1, HTTP/OpenAPI projection, circuit-breaker halt, auto_guarded promotion via host manifest, minimal desk + rejuvenation, rich-history digest"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kav_sdk*"]
