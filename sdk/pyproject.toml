[project]
name = "kav-sdk"
version = "0.1.0"
description = "KAV contracts as Python: Pydantic models for the five adapter/research contracts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kav_sdk*"]
